<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solar System — N-body Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <div class="row">
      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>
      <label>Speed <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1"></label>
      <label>Trails <input id="trails" type="checkbox" checked></label>
      <label>Center Sun <input id="centerSun" type="checkbox" checked></label>
    </div>
    <div class="row">
      <span id="timeInfo">Time step: 1 day · Running</span>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script src="main.js"></script>
</body>
</html>
